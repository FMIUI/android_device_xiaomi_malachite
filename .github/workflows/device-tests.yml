# Runs the device tree's tests, so a broken change shows up on its push or pull
# request instead of hours into a ROM build. The repositories some tests check
# against are checked out beside the tree, from the same LineageOS line.
name: Device tests

on:
  push:
    branches: ["lineage-*", "fix/**", "feature/**"]
  pull_request:
    branches: ["lineage-*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LINE: lineage-23.2

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
      - uses: actions/checkout@v4
        with:
          repository: malachite-project/android_device_mediatek_sepolicy_vndr
          ref: ${{ env.LINE }}
          path: device_mediatek_sepolicy_vndr
      - uses: actions/checkout@v4
        with:
          repository: malachite-project/android_hardware_mediatek
          ref: ${{ env.LINE }}
          path: hardware_mediatek
      - uses: actions/checkout@v4
        with:
          repository: malachite-project/android_hardware_dolby
          ref: ${{ env.LINE }}
          path: dolby-hwdolby
      - name: Run the device tests
        working-directory: device
        run: python3 -m unittest discover -s tests -v
